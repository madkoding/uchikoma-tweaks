# Uchikoma: control del ventilador por kernel.
#
# La BIOS del Aspire One enciende el ventilador recien a 63C -> el equipo se
# calienta demasiado antes de que arranque. Con kernelmode=1 el kernel manda:
# enciende sobre `fanon`, apaga bajo `fanoff`.
#
# fanoff=0 => el ventilador NUNCA se apaga (siempre activo). Decision del
# usuario (2026-09-20) para mantener el CPU/GPU frescos. En este hardware el
# ventilador es BINARIO (cooling_device2/max_state=1): no tiene velocidad
# variable, "siempre activo" = girando constantemente. Consume bateria, pero
# el equipo esta casi siempre en AC.
#
# fanon=38 mantiene el umbral de encendido bajo por si acaso.
# Con fanoff=0 la condicion de apagado (temp < 0) nunca se cumple.
#
# NOTA: fanon/fanoff son escribibles EN CALIENTE via sysfs
#   sudo sh -c "echo 0 > /sys/module/acerhdf/parameters/fanoff"
# (kernelmode NO lo es: requiere recargar el modulo).
options acerhdf kernelmode=1 fanon=38 fanoff=0 interval=5
